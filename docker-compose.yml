version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tahelaev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tahelaev_db
      POSTGRES_USER: tahelaev_user
      POSTGRES_PASSWORD: tahelaev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tahelaev_user -d tahelaev_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
